<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Pass by Co-Misyon</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            background-color: #0f172a;
        }


        .animation-container {
            background: #0f172a;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            z-index: -1;
            overflow: hidden;
        }

        .shape1 {
            position: absolute;
            top: 42%;
            left: 70%;
            width: 25rem;
            height: 25rem;
            background: #10b981;
            border-radius: 24% 76% 77% 23% / 30% 30% 70% 70%;
            filter: blur(6rem);
            animation: shape1 20s infinite;
        }

        @keyframes shape1 {
            0% { transform: translate(0, 0); border-radius: 24% 76% 77% 23% / 30% 30% 70% 70%; }
            25% { transform: translate(-55%, -10%); border-radius: 28% 72% 81% 19% / 78% 25% 75% 22%; height: 50rem; width: 80rem; }
            50% { transform: translate(-90%, -10%); border-radius: 60% 40% 0% 100% / 1% 74% 26% 99%; }
            75% { transform: translate(-30%, -10%); border-radius: 0% 100% 100% 0% / 0% 100% 100% 0%; height: 30rem; width: 45rem; }
            100% { transform: translate(0%, 0%); border-radius: 24% 76% 77% 23% / 30% 30% 70% 70%; }
        }

        .shape2 {
            position: absolute;
            top: 33%;
            left: 40%;
            width: 35rem;
            height: 25rem;
            background: #1e3a8a;
            border-radius: 73% 27% 77% 23% / 53% 4% 96% 47%;
            filter: blur(12rem);
            animation: shape2 35s infinite;
        }

        @keyframes shape2 {
            0% { transform: translate(0, 0); border-radius: 73% 27% 77% 23% / 53% 4% 96% 47%; }
            25% { transform: translate(-55%, -55%); border-radius: 28% 72% 81% 19% / 78% 25% 75% 22%; height: 50rem; width: 50rem; }
            50% { transform: translate(-70%, -70%); border-radius: 60% 40% 0% 100% / 1% 74% 26% 99%; }
            75% { transform: translate(-30%, -30%); border-radius: 0% 100% 100% 0% / 0% 100% 100% 0%; }
            100% { transform: translate(0%, 0%); border-radius: 73% 27% 77% 23% / 53% 4% 96% 47%; }
        }

        .shape3 {
            position: absolute;
            top: 20%;
            left: 80%;
            width: 25rem;
            height: 25rem;
            background: #ffffff;
            border-radius: 70% 30% 80% 20% / 42% 25% 75% 58%;
            filter: blur(14rem);
            animation: shape3 35s infinite;
        }

        @keyframes shape3 {
            0% { transform: translate(0, 0); border-radius: 70% 30% 80% 20% / 42% 25% 75% 58%; }
            25% { transform: translate(-125%, -25%); border-radius: 28% 72% 81% 19% / 78% 25% 75% 22%; height: 50rem; width: 50rem; }
            50% { transform: translate(-90%, -35%); border-radius: 60% 40% 0% 100% / 1% 74% 26% 99%; }
            75% { transform: translate(-30%, -40%); border-radius: 0% 100% 100% 0% / 0% 100% 100% 0%; }
            100% { transform: translate(0%, 0%); border-radius: 70% 30% 80% 20% / 42% 25% 75% 58%; }
        }

        .shape4 {
            position: absolute;
            top: 42%;
            left: 70%;
            width: 25rem;
            height: 25rem;
            background: rgba(16, 185, 129, 0.7);
            border-radius: 24% 76% 77% 23% / 30% 30% 70% 70%;
            filter: blur(5rem);
        }

        .shape5 {
            position: absolute;
            top: 33%;
            left: 40%;
            width: 35rem;
            height: 25rem;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 73% 27% 77% 23% / 53% 4% 96% 47%;
            filter: blur(5rem);
        }

        .shape6 {
            position: absolute;
            top: 20%;
            left: 80%;
            width: 25rem;
            height: 25rem;
            background: rgba(30, 58, 138, 0.7); /* Blue */
            border-radius: 70% 30% 80% 20% / 42% 25% 75% 58%;
            filter: blur(5rem);
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    </style>
</head>
<body onload="checkLogin(); loadStudentMessages();" class="min-h-screen text-white font-poppins antialiased overflow-x-hidden selection:bg-green-500 selection:text-white">

    <div class="animation-container">
        <div class="shape1"></div>
        <div class="shape2"></div>
        <div class="shape3"></div>
        <div class="shape4"></div>
        <div class="shape5"></div>
        <div class="shape6"></div>
    </div>

    <header>
        <nav class="glass-nav fixed top-4 left-0 right-0 max-w-[calc(100%-2rem)] md:max-w-md mx-auto z-40 transition-all duration-300 rounded-2xl px-5 py-3 flex justify-between items-center shadow-lg">
            <h1 class="font-montserrat font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-300 to-white text-sm tracking-widest uppercase">
                Adviser's Portal
            </h1>
            
            <a href="index.html" onclick="logout(event)" class="logout-btn flex items-center gap-2 group touch-manipulation">
                <span class="text-xs font-semibold text-white/80 group-hover:text-red-300 transition-colors">Logout</span>

                <img src="https://via.placeholder.com/20/ffffff/0f172a?text=L" alt="Logout" class="w-5 h-5 rounded-sm opacity-80 group-hover:opacity-100 transition-opacity">
            </a>
        </nav>
    </header>

    <main class="container pt-28 pb-10 px-5 max-w-md mx-auto flex flex-col gap-8">
        
        <section class="glass-panel rounded-3xl p-6 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-green-500/20 rounded-full blur-2xl"></div>
            
            <h2 class="font-montserrat text-xl font-bold mb-4 flex items-center gap-2">
                Send Message to Principal
            </h2>
            
            <textarea id="message" class="w-full bg-white/5 border border-white/20 rounded-xl p-4 text-white placeholder-white/40 focus:outline-none focus:border-green-400 focus:bg-white/10 transition-all duration-300 min-h-[140px] resize-none text-sm mb-4 shadow-inner" placeholder="Type your concern here..."></textarea>
            
            <button onclick="sendMessage()" class="glass-btn w-full py-3.5 rounded-xl font-montserrat font-bold tracking-wide hover:bg-green-500/30 hover:border-green-400 active:scale-95 transition-all duration-300 text-sm flex justify-center items-center gap-2 group text-white">
                <span>Send Message</span>
                <img src="https://via.placeholder.com/16/ffffff/0f172a?text=+" alt="Send Icon" class="w-4 h-4 rounded-sm opacity-80 group-hover:opacity-100 transition-opacity">
            </button>
        </section>

        <section>
            <h3 class="font-montserrat text-lg font-bold mb-4 pl-3 border-l-4 border-blue-400">Your Messages</h3>
            
            <div id="studentMessages" class="flex flex-col gap-4">

                <div class="card glass-panel rounded-2xl p-5 hover:bg-white/5 transition-colors border border-white/10 shadow-lg">
                    <div class="flex justify-between items-start border-b border-white/10 pb-3 mb-3">
                        <strong class="font-montserrat text-sm text-green-300 block">Your Name</strong>
                        <p class="text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded-full bg-yellow-500/20 border border-yellow-500/30 text-yellow-300">Pending</p>
                    </div>
                    <p class="text-sm text-white/80 leading-relaxed font-light">Your Message content goes here. It will display the text that you submitted to the principal's office.</p>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript logic matching your provided structure -->
    <script>
        function checkLogin() {
            console.log("Checking login status...");
            // Logic for checking authentication would go here
        }

        function loadStudentMessages() {
            console.log("Loading previous messages...");
            // Logic to fetch and inject messages into #studentMessages would go here
        }

        function logout(event) {
            event.preventDefault();
            console.log("Logging out...");
            // Redirects to your already made page. 
            // Change 'login.html' to the actual filename of your login/home page!
            window.location.href = 'login.html';
        }

        function sendMessage() {
            const msgBox = document.getElementById('message');
            if(msgBox.value.trim() === "") {
                alert("Please type a message first.");
                return;
            }

            // Create a new card based on your structure
            const newCard = document.createElement('div');
            newCard.className = 'card glass-panel rounded-2xl p-5 hover:bg-white/5 transition-colors border border-white/10 shadow-lg mt-4';
            newCard.style.animation = "shape1 0.3s ease-out"; // tiny fade in
            
            newCard.innerHTML = `
                <div class="flex justify-between items-start border-b border-white/10 pb-3 mb-3">
                    <strong class="font-montserrat text-sm text-green-300 block">Current User</strong>
                    <p class="text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded-full bg-blue-500/20 border border-blue-500/30 text-blue-300">Sent Just Now</p>
                </div>
                <p class="text-sm text-white/80 leading-relaxed font-light">${msgBox.value}</p>
            `;

            document.getElementById('studentMessages').prepend(newCard);
            msgBox.value = ""; // clear textarea
        }
    </script>
</body>
</html>
