<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Pass by Co-Misyon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            margin: 0;
            background-color: #0f172a;
        }

        .animation-container {
            background: #0f172a;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            z-index: -1;
            overflow: hidden;
        }

        .shape1 {
            position: absolute;
            top: 42%;
            left: 70%;
            width: 25rem;
            height: 25rem;
            background: #10b981;
            border-radius: 24% 76% 77% 23% / 30% 30% 70% 70%;
            filter: blur(6rem);
            animation: shape1 20s infinite;
        }

        @keyframes shape1 {
            0% { transform: translate(0, 0); border-radius: 24% 76% 77% 23% / 30% 30% 70% 70%; }
            25% { transform: translate(-55%, -10%); border-radius: 28% 72% 81% 19% / 78% 25% 75% 22%; height: 50rem; width: 80rem; }
            50% { transform: translate(-90%, -10%); border-radius: 60% 40% 0% 100% / 1% 74% 26% 99%; }
            75% { transform: translate(-30%, -10%); border-radius: 0% 100% 100% 0% / 0% 100% 100% 0%; height: 30rem; width: 45rem; }
            100% { transform: translate(0%, 0%); border-radius: 24% 76% 77% 23% / 30% 30% 70% 70%; }
        }

        .shape2 {
            position: absolute;
            top: 33%;
            left: 40%;
            width: 35rem;
            height: 25rem;
            background: #1e3a8a;
            border-radius: 73% 27% 77% 23% / 53% 4% 96% 47%;
            filter: blur(12rem);
            animation: shape2 35s infinite;
        }

        @keyframes shape2 {
            0% { transform: translate(0, 0); border-radius: 73% 27% 77% 23% / 53% 4% 96% 47%; }
            25% { transform: translate(-55%, -55%); border-radius: 28% 72% 81% 19% / 78% 25% 75% 22%; height: 50rem; width: 50rem; }
            50% { transform: translate(-70%, -70%); border-radius: 60% 40% 0% 100% / 1% 74% 26% 99%; }
            75% { transform: translate(-30%, -30%); border-radius: 0% 100% 100% 0% / 0% 100% 100% 0%; }
            100% { transform: translate(0%, 0%); border-radius: 73% 27% 77% 23% / 53% 4% 96% 47%; }
        }

        .shape3 {
            position: absolute;
            top: 20%;
            left: 80%;
            width: 25rem;
            height: 25rem;
            background: #ffffff;
            border-radius: 70% 30% 80% 20% / 42% 25% 75% 58%;
            filter: blur(14rem);
            animation: shape3 35s infinite;
        }

        @keyframes shape3 {
            0% { transform: translate(0, 0); border-radius: 70% 30% 80% 20% / 42% 25% 75% 58%; }
            25% { transform: translate(-125%, -25%); border-radius: 28% 72% 81% 19% / 78% 25% 75% 22%; height: 50rem; width: 50rem; }
            50% { transform: translate(-90%, -35%); border-radius: 60% 40% 0% 100% / 1% 74% 26% 99%; }
            75% { transform: translate(-30%, -40%); border-radius: 0% 100% 100% 0% / 0% 100% 100% 0%; }
            100% { transform: translate(0%, 0%); border-radius: 70% 30% 80% 20% / 42% 25% 75% 58%; }
        }

        .shape4 {
            position: absolute;
            top: 42%;
            left: 70%;
            width: 25rem;
            height: 25rem;
            background: rgba(16, 185, 129, 0.7);
            border-radius: 24% 76% 77% 23% / 30% 30% 70% 70%;
            filter: blur(5rem);
        }

        .shape5 {
            position: absolute;
            top: 33%;
            left: 40%;
            width: 35rem;
            height: 25rem;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 73% 27% 77% 23% / 53% 4% 96% 47%;
            filter: blur(5rem);
        }

        .shape6 {
            position: absolute;
            top: 20%;
            left: 80%;
            width: 25rem;
            height: 25rem;
            background: rgba(30, 58, 138, 0.7); /* Blue */
            border-radius: 70% 30% 80% 20% / 42% 25% 75% 58%;
            filter: blur(5rem);
        }

        /* Glassmorphism Utilities */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body onload="checkLogin(); loadStudentMessages();" class="min-h-screen text-white font-poppins antialiased overflow-x-hidden selection:bg-green-500 selection:text-white">

    <div class="animation-container">
        <div class="shape1"></div>
        <div class="shape2"></div>
        <div class="shape3"></div>
        <div class="shape4"></div>
        <div class="shape5"></div>
        <div class="shape6"></div>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 -translate-y-10 opacity-0 px-6 py-3 rounded-full text-white font-semibold text-sm shadow-xl z-50 transition-all duration-300 pointer-events-none text-center min-w-[200px]">
        Message
    </div>

    <header>
        <nav class="glass-nav fixed top-4 left-0 right-0 max-w-[calc(100%-2rem)] md:max-w-md mx-auto z-40 transition-all duration-300 rounded-2xl px-5 py-3 flex justify-between items-center shadow-lg">
            <h1 class="font-montserrat font-bold text-transparent bg-clip-text bg-gradient-to-r from-green-300 to-white text-sm tracking-widest uppercase">
                Adviser's Portal
            </h1>
            
            <a href="#" onclick="logout(event)" class="logout-btn flex items-center gap-2 group touch-manipulation">
                <span class="text-xs font-semibold text-white/80 group-hover:text-red-300 transition-colors">Logout</span>
                <!-- Updated Icon visual -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white/80 group-hover:text-red-300 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>
        </nav>
    </header>

    <main id="mainContent" class="container pt-28 pb-10 px-5 max-w-md mx-auto flex flex-col gap-8 transition-opacity duration-500">
        
        <section class="glass-panel rounded-3xl p-6 relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-green-500/20 rounded-full blur-2xl"></div>
            
            <h2 class="font-montserrat text-xl font-bold mb-4 flex items-center gap-2">
                Send Message to Principal
            </h2>
            
            <!-- Added Name and Section Inputs -->
            <div class="flex flex-col sm:flex-row gap-3 mb-3">
                <input type="text" id="senderName" class="flex-1 bg-white/5 border border-white/20 rounded-xl p-3.5 text-white placeholder-white/40 focus:outline-none focus:border-green-400 focus:bg-white/10 transition-all duration-300 text-sm shadow-inner" placeholder="Your Full Name">
                <input type="text" id="senderSection" class="w-full sm:w-1/3 bg-white/5 border border-white/20 rounded-xl p-3.5 text-white placeholder-white/40 focus:outline-none focus:border-green-400 focus:bg-white/10 transition-all duration-300 text-sm shadow-inner" placeholder="Section">
            </div>

            <textarea id="message" class="w-full bg-white/5 border border-white/20 rounded-xl p-4 text-white placeholder-white/40 focus:outline-none focus:border-green-400 focus:bg-white/10 transition-all duration-300 min-h-[140px] resize-none text-sm mb-4 shadow-inner" placeholder="Type your concern here..."></textarea>
            
            <button onclick="sendMessage()" class="glass-btn w-full py-3.5 rounded-xl font-montserrat font-bold tracking-wide hover:bg-green-500/30 hover:border-green-400 active:scale-95 transition-all duration-300 text-sm flex justify-center items-center gap-2 group text-white">
                <span>Send Message</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 opacity-80 group-hover:opacity-100 transition-opacity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </section>

        <section>
            <h3 class="font-montserrat text-lg font-bold mb-4 pl-3 border-l-4 border-blue-400">Your Messages</h3>
            
            <div id="studentMessages" class="flex flex-col gap-4">
                <!-- Example Default Card -->
                <div class="card glass-panel rounded-2xl p-5 hover:bg-white/5 transition-colors border border-white/10 shadow-lg">
                    <div class="flex justify-between items-start border-b border-white/10 pb-3 mb-3">
                        <p class="text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded-full bg-yellow-500/20 border border-yellow-500/30 text-yellow-300 mt-1">Pending</p>
                    </div>
                    <p class="text-sm text-white/80 leading-relaxed font-light">Your Message content goes here. It will display the text that you submitted to the principal's office.</p>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Custom Toast Notification Logic
        function showMessage(msg, isError = true) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            
            // Set colors based on success or error
            if (isError) {
                toast.className = "fixed top-24 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 px-6 py-3 rounded-full text-white font-semibold text-sm shadow-xl z-50 transition-all duration-300 pointer-events-none text-center min-w-[200px] bg-red-500 border border-red-400";
            } else {
                toast.className = "fixed top-24 left-1/2 transform -translate-x-1/2 translate-y-0 opacity-100 px-6 py-3 rounded-full text-white font-semibold text-sm shadow-xl z-50 transition-all duration-300 pointer-events-none text-center min-w-[200px] bg-green-500 border border-green-400";
            }

            // Hide after 3 seconds
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-10');
            }, 3000);
        }

        function checkLogin() {
            console.log("Checking login status...");
            // Logic for checking authentication
            const isLoggedIn = sessionStorage.getItem('isLoggedIn') !== 'false';
            if (!isLoggedIn) {
                // In a real app, you'd immediately redirect to login.html here
                console.log("User is not logged in.");
            }
        }

        function loadStudentMessages() {
            console.log("Loading previous messages...");
            // Logic to fetch and inject messages into #studentMessages would go here
        }

        function logout(event) {
            event.preventDefault();
            console.log("Logging out...");
            
            // 1. Clear local/session storage to actually invalidate the session
            localStorage.clear();
            sessionStorage.setItem('isLoggedIn', 'false');

            // 2. Show feedback
            showMessage("Logging out safely...", false);
            
            // 3. Optional: Fade out main content for effect
            document.getElementById('mainContent').style.opacity = '0';

            // 4. Redirect to actual login page after a short delay
            setTimeout(() => {
                // Ensure this file name matches your real login screen (e.g., login.html)
                window.location.href = 'index.html'; 
            }, 800);
        }

        function sendMessage() {
            const nameBox = document.getElementById('senderName');
            const sectionBox = document.getElementById('senderSection');
            const msgBox = document.getElementById('message');

            // Validation: Ensure all fields are filled
            if(nameBox.value.trim() === "" || sectionBox.value.trim() === "" || msgBox.value.trim() === "") {
                showMessage("Please fill in your name, section, and message.", true);
                return;
            }

            // Create a new card based on structure
            const newCard = document.createElement('div');
            newCard.className = 'card glass-panel rounded-2xl p-5 hover:bg-white/5 transition-colors border border-white/10 shadow-lg mt-4';
            newCard.style.animation = "cardFadeIn 0.4s ease-out forwards"; // using new animation
            
            newCard.innerHTML = `
                <div class="flex justify-between items-start border-b border-white/10 pb-3 mb-3">
                    <div>
                        <strong class="font-montserrat text-sm text-green-300 block">${nameBox.value.trim()}</strong>
                        <span class="text-xs text-white/50 block mt-1">Section: ${sectionBox.value.trim()}</span>
                    </div>
                    <p class="text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded-full bg-blue-500/20 border border-blue-500/30 text-blue-300 mt-1">Sent Just Now</p>
                </div>
                <p class="text-sm text-white/80 leading-relaxed font-light whitespace-pre-wrap">${msgBox.value.trim()}</p>
            `;

            document.getElementById('studentMessages').prepend(newCard);
            
            // Clear all inputs
            nameBox.value = "";
            sectionBox.value = "";
            msgBox.value = "";
            
            showMessage("Message sent successfully!", false);
        }
    </script>
</body>
</html>
