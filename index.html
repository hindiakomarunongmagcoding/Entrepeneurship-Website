<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login | Romblon National High School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Montserrat', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a8d0e6 0%, #f0f9ff 100%);
            position: relative;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Dynamic Background Animation */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); /* Scenic field placeholder */
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: 0;
            animation: backgroundZoom 20s infinite alternate linear;
        }

        @keyframes backgroundZoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* Floating Shapes Animation */
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: float 10s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-50px) rotate(180deg); }
        }

        /* Main Container with Entrance Animation */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 500px;
            padding: 40px 35px;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.8s forwards ease-out;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #242B67;
            font-size: 28px;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        h2 {
            text-align: center;
            margin: 20px 0 15px;
            color: #444;
            font-size: 22px;
            font-weight: 600;
        }

        .input-group {
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #a8d0e6;
            box-shadow: 0 0 10px rgba(168, 208, 230, 0.4);
            transform: translateY(-2px);
        }

        button {
            font-size: 18px;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background-color: #29ce52;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(41, 206, 82, 0.3);
        }

        button:hover {
            background-color: #1d5752;
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(29, 87, 82, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .status-msg {
            text-align: center;
            font-size: 14px;
            margin-top: 8px;
            min-height: 20px;
            font-weight: 500;
        }

        #error, #signupError { color: #e74c3c; }
        #signupSuccess { color: #27ae60; }

        hr {
            margin: 25px 0;
            border: none;
            border-top: 1px dashed #cbd5e0;
            width: 100%;
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            background: #f0f4f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .logo-container img {
            width: 80%;
            height: auto;
        }

        /* Form section transition */
        .form-section {
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Animated Background Shapes -->
    <div class="shape" style="width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s;"></div>
    <div class="shape" style="width: 120px; height: 120px; bottom: 15%; right: 10%; animation-delay: 2s;"></div>
    <div class="shape" style="width: 60px; height: 60px; top: 60%; left: 5%; animation-delay: 4s;"></div>

    <div class="container">
        <div class="logo-container">
            <!-- Using a fallback SVG if local image not found -->
            <img src="QP_TM.png" alt="RNHS Logo" onerror="this.src='https://via.placeholder.com/100?text=RNHS'">
        </div>

        <h1>Welcome to Romblon National High School</h1>
        
        <hr>

        <div class="form-section">
            <h2>Portal Login</h2>
            <div class="input-group">
                <input type="text" id="username" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password">
            </div>
            <button onclick="login()">Sign In</button>
            <p id="error" class="status-msg"></p>
        </div>

        <hr>

        <div class="form-section">
            <h2>Create New Profile</h2>
            <div class="input-group">
                <input type="text" id="signupName" placeholder="Full Name">
            </div>
            <div class="input-group">
                <input type="text" id="signupUsername" placeholder="Preferred Username">
            </div>
            <div class="input-group">
                <input type="password" id="signupPassword" placeholder="Set Password">
            </div>
            <button onclick="signup()" style="background-color: #242B67;">Register Account</button>
            <p id="signupError" class="status-msg"></p>
            <p id="signupSuccess" class="status-msg"></p>
        </div>
    </div>

    <script>
        function showMessage(elementId, text, duration = 3000) {
            const el = document.getElementById(elementId);
            el.innerText = text;
            setTimeout(() => {
                el.innerText = "";
            }, duration);
        }

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (!user || !pass) {
                showMessage('error', 'Please fill in all login fields.');
                return;
            }

            // Simple interactive feedback
            const btn = event.target;
            btn.innerText = "Verifying...";
            btn.disabled = true;

            setTimeout(() => {
                showMessage('error', 'Invalid username or password. Please try again.');
                btn.innerText = "Sign In";
                btn.disabled = false;
            }, 1200);
        }

        function signup() {
            const name = document.getElementById('signupName').value;
            const user = document.getElementById('signupUsername').value;
            const pass = document.getElementById('signupPassword').value;

            if (!name || !user || !pass) {
                showMessage('signupError', 'All fields are required for registration.');
                return;
            }

            const btn = event.target;
            btn.innerText = "Creating Profile...";
            btn.disabled = true;

            setTimeout(() => {
                showMessage('signupSuccess', 'Profile created successfully! You may now login.');
                document.getElementById('signupName').value = "";
                document.getElementById('signupUsername').value = "";
                document.getElementById('signupPassword').value = "";
                btn.innerText = "Register Account";
                btn.disabled = false;
            }, 1500);
        }

        // Add a subtle parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const amount = 15;
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            const container = document.querySelector('.container');
            container.style.boxShadow = `${-x}px ${-y}px 40px rgba(0,0,0,0.15)`;
        });
    </script>
</body>
</html>
