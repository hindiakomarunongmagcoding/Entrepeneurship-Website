<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quick Pass by Co-Misyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <style>
        :root {
            --primary-blue: #3b82f6;
            --primary-green: #29ce52;
            --dark-blue: #242B67;
            --soft-white: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 15px;
            overflow: hidden;
            background: #ffffff;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
            padding: 20px;
        }

        .welcome-content {
            text-align: center;
            width: 100%;
            max-width: 320px;
            animation: scalePulse 2s infinite ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes scalePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .welcome-logo {
            width: 240px; 
            height: 60px;
            margin-bottom: 25px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        .welcome-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: var(--dark-blue);
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeInDown 0.8s forwards 0.3s;
            line-height: 1.3;
        }

        .welcome-subtext {
            font-size: 14px;
            color: var(--primary-green);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 0.8s forwards 0.6s;
        }

        .progress-container {
            width: 180px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 35px auto 0;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            position: absolute;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-green));
            border-radius: 10px;
            animation: loadProgress 7.5s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .animation-container {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            filter: blur(5rem);
            opacity: 0.35;
        }

        .shape1 {
            top: 40%; left: 60%; width: 20rem; height: 20rem;
            background: var(--primary-blue);
            border-radius: 24% 76% 77% 23% / 30% 30% 70% 70%;
            animation: shape1 15s infinite alternate ease-in-out;
        }

        .shape2 {
            top: 20%; left: 10%; width: 25rem; height: 18rem;
            background: var(--primary-green);
            border-radius: 73% 27% 77% 23% / 53% 4% 96% 47%;
            animation: shape2 20s infinite alternate ease-in-out;
        }

        @keyframes shape1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-10%, -10%) scale(1.2); border-radius: 60% 40% 30% 70%; }
        }

        @keyframes shape2 {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(10%, 15%) rotate(45deg); border-radius: 30% 70% 70% 30%; }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 35px 25px;
            background-color: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
        }

        .container.loaded {
            animation: fadeInUp 0.8s forwards ease-out;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container {
            width: 180px;
            height: 45px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }

        h1 {
            text-align: center;
            color: var(--dark-blue);
            font-size: 22px;
            margin-bottom: 6px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-group { width: 100%; margin-bottom: 16px; }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            appearance: none;
        }

        input:focus {
            border-color: var(--primary-blue);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.08);
        }

        button {
            font-size: 16px;
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background-color: var(--primary-green);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            filter: brightness(0.9);
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: #94a3b8 !important;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .caution-text {
            font-size: 13px;
            color: #64748b;
            text-align: center;
            margin-top: 20px;
            line-height: 1.5;
        }

        .toggle-link {
            color: var(--primary-blue);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        .toggle-link:hover {
            color: var(--dark-blue);
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
            min-height: 20px;
            font-weight: 500;
            padding: 10px;
            border-radius: 10px;
            width: 100%;
        }

        .error { color: #b91c1c; background: #fef2f2; border: 1px solid #fee2e2; }
        .success { color: #065f46; background: #ecfdf5; border: 1px solid #d1fae5; }
        .hidden { display: none; }

        .fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="welcome-content">
            <img src="quickpass_logo.png" alt="Quick Pass Logo" class="welcome-logo" onerror="this.src='https://placehold.co/800x200/ffffff/242B67?text=QUICK+PASS'">
            <div class="welcome-text">Welcome to Romblon National High School</div>
            <div class="welcome-subtext">Introducing Quick Pass <br>by Co-Misyon</div>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>

    <div class="animation-container">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
    </div>

    <div class="container" id="portal-container">
        <div class="logo-container">
            <img src="quickpass_logo.png" alt="Quick Pass Logo" onerror="this.src='https://placehold.co/800x200/ffffff/242B67?text=QUICK+PASS'">
        </div>

        <h1 id="form-title">Advisers' Portal Login</h1>
        
        <form id="auth-form" style="width: 100%;">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email Address" spellcheck="false" autocomplete="email" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
            </div>
            
            <button type="submit" id="login-btn">Sign In</button>
            
            <p id="message" class="status-msg hidden"></p>
        </form>

        <div class="caution-text" id="toggle-area">
            Are you an admin? <br>
            <span class="toggle-link" onclick="toggleAuth()">Log in as Admin</span>
        </div>
    </div>

    <script>
        const adviserConfig = {
            url: 'https://qpzirlvpdlvewtuqlbjz.supabase.co',
            key: 'sb_publishable_6hxgL5FhVBTBaqT9mjJ95w_D2LCTLrv'
        };
        
        const adminConfig = {
            url: 'https://dwablbdbbdgddnfduagc.supabase.co',
            key: 'sb_publishable_pGABAwv7L2dMPS77PHJ5NA_kjalL6yn'
        };

        let adviserClient, adminClient;
        
        try {
            adviserClient = supabase.createClient(adviserConfig.url, adviserConfig.key, {
                auth: { storageKey: 'quickpass-adviser-token' }
            });
        } catch (e) {
            console.error("Adviser Supabase Initialization Error:", e);
        }

        try {
            adminClient = supabase.createClient(adminConfig.url, adminConfig.key, {
                auth: { storageKey: 'quickpass-admin-token' }
            });
        } catch (e) {
            console.warn("Admin Supabase Initialization Skipped:", e.message);
        }

        const loader = document.getElementById('loading-screen');
        const portal = document.getElementById('portal-container');
        const messageElement = document.getElementById('message');
        const loginBtn = document.getElementById('login-btn');
        const formTitle = document.getElementById('form-title');
        const toggleArea = document.getElementById('toggle-area');
        const authForm = document.getElementById('auth-form');

        let isAdviserMode = true;

        document.addEventListener('DOMContentLoaded', async () => {
            let isAlreadyLoggedIn = false;

            if (sessionStorage.getItem('isLoggedIn') === 'false') {
                if (adviserClient) await adviserClient.auth.signOut();
                if (adminClient) await adminClient.auth.signOut();
                sessionStorage.removeItem('isLoggedIn');
            } else {
                if (adviserClient) {
                    try {
                        const { data: { session: advSession } } = await adviserClient.auth.getSession();
                        if (advSession) {

                            window.location.href = 'login_adviser.html'; 
                            isAlreadyLoggedIn = true;
                        }
                    } catch (e) {
                        console.error("Adviser session check failed:", e);
                    }
                }
                
                if (adminClient && !isAlreadyLoggedIn) {
                    try {
                        const { data: { session: adminSession } } = await adminClient.auth.getSession();
                        if (adminSession) {
                            window.location.href = 'login_admin.html'; 
                            isAlreadyLoggedIn = true;
                        }
                    } catch (e) {
                        console.error("Admin session check failed:", e);
                    }
                }
            }

            if (isAlreadyLoggedIn) return;

            setTimeout(() => {
                loader.classList.add('fade-out');
                portal.classList.add('loaded');
                setTimeout(() => { loader.style.display = 'none'; }, 800);
            }, 7600);
        });

        function showStatus(text, type) {
            messageElement.innerText = text;
            messageElement.className = `status-msg ${type}`;
            messageElement.classList.remove('hidden');
        }

        function toggleAuth() {
            isAdviserMode = !isAdviserMode;
            messageElement.classList.add('hidden');
            
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';

            if (isAdviserMode) {
                formTitle.innerText = "Advisers' Portal Login";
                loginBtn.style.backgroundColor = "var(--primary-green)";
                toggleArea.innerHTML = 'Are you an admin? <br><span class="toggle-link" onclick="toggleAuth()">Log in as Admin</span>';
            } else {
                formTitle.innerText = "Admin Portal Login";
                loginBtn.style.backgroundColor = "var(--dark-blue)";
                toggleArea.innerHTML = 'Are you an adviser? <br><span class="toggle-link" onclick="toggleAuth()">Log in as Adviser</span>';
            }
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const activeClient = isAdviserMode ? adviserClient : adminClient;
            
            if (!activeClient) return showStatus("Database connection error or not configured.", "error");

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) return showStatus("Please fill in all fields.", "error");

            loginBtn.innerText = "Signing In...";
            loginBtn.disabled = true;

            try {
                const { data, error } = await activeClient.auth.signInWithPassword({ email, password });
                if (error) {
                    showStatus(error.message, "error");
                    loginBtn.innerText = "Sign In";
                    loginBtn.disabled = false;
                } else {
                    showStatus("Authenticated! Redirecting...", "success");
                    
                    sessionStorage.setItem('isLoggedIn', 'true');
                    
                    setTimeout(() => {
                        if (isAdviserMode) {
                            window.location.href = 'login_adviser.html'; 
                        } else {
                            window.location.href = 'login_admin.html';   
                        }
                    }, 1000);
                }
            } catch (err) {
                showStatus("Network Error.", "error");
                loginBtn.innerText = "Sign In";
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
